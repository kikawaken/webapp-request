name: Azure Web App Request

on:
  issues:
    types:
      - opened

permissions:
  contents: read
  issues: read

jobs:
  create-private-issue:
    name: Create Private Approval Issue
    runs-on: ubuntu-latest

    if: >
      github.event.issue.pull_request == null &&
      startsWith(github.event.issue.title, 'Azure Web App Request')

    steps:
      - name: Parse Issue Form
        id: parse
        shell: python
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          import os
          import re
          import sys

          body = os.environ.get("ISSUE_BODY", "")
          marker = "<!-- AZURE_WEBAPP_REQUEST_FORM_V1 -->"

          if marker not in body:
              print("::error::Invalid Azure Web App Issue Form.")
              print("::error::Request marker was not found.")
              sys.exit(1)

          fields = {}
          pattern = re.compile(
              r"^### (?P<label>.+?)?
?
(?P<value>[^
]*)",
              re.MULTILINE
          )

          for match in pattern.finditer(body):
              fields[match.group("label").strip()] = match.group("value").strip()

          mapping = {
              "Resource Group": "resource_group",
              "Azure Region": "location",
              "App Service Plan": "app_service_plan",
              "Web App Name": "webapp_name",
              "Runtime": "runtime",
              "Operating System": "os",
              "App Service Plan SKU": "sku",
              "Environment": "environment",
              "HTTPS Only": "https_only",
              "Managed Identity": "managed_identity",
              "Public Network Access": "public_network_access",
              "Application Insights": "application_insights",
          }

          values = {}
          for label, key in mapping.items():
              value = fields.get(label, "")
              if not value:
                  print(f"::error::Missing Issue Form field: {label}")
                  sys.exit(1)
              values[key] = value

          errors = []

          if not re.fullmatch(r"[a-z0-9-]+", values["webapp_name"]):
              errors.append("Web App Name must contain only lowercase letters, numbers and hyphens.")
          if len(values["webapp_name"]) > 60:
              errors.append("Web App Name must be 60 characters or less.")
          if not re.fullmatch(r"[A-Za-z0-9._-]+", values["resource_group"]):
              errors.append("Resource Group name contains invalid characters.")
          if not re.fullmatch(r"[A-Za-z0-9._-]+", values["app_service_plan"]):
              errors.append("App Service Plan name contains invalid characters.")

          allowed_locations = {
              "japaneast", "japanwest", "eastus",
              "eastus2", "westus2", "southeastasia"
          }
          allowed_runtimes = {
              "Python latest", "Python 3.13", "Python 3.12",
              "Node.js latest", "Node.js 22", "Node.js 20",
              ".NET latest", ".NET 8.0",
              "Java latest", "Java 21", "Java 17"
          }

          if values["location"] not in allowed_locations:
              errors.append(f"Unsupported Azure Region: {values['location']}")
          if values["runtime"] not in allowed_runtimes:
              errors.append(f"Unsupported Runtime: {values['runtime']}")
          if values["os"] not in {"Linux", "Windows"}:
              errors.append(f"Unsupported Operating System: {values['os']}")
          if values["sku"] not in {"B1", "B2", "S1", "P1v3"}:
              errors.append(f"Unsupported SKU: {values['sku']}")
          if values["environment"] not in {"DEV", "TEST", "PROD"}:
              errors.append(f"Unsupported Environment: {values['environment']}")

          for key in (
              "https_only",
              "managed_identity",
              "public_network_access",
              "application_insights",
          ):
              if values[key] not in {"true", "false"}:
                  errors.append(f"{key} must be true or false.")

          if values["runtime"].startswith("Python") and values["os"] != "Linux":
              errors.append("Python runtime requires Linux.")

          if values["environment"] == "PROD":
              if values["https_only"] != "true":
                  errors.append("PROD requires HTTPS Only=true.")
              if values["managed_identity"] != "true":
                  errors.append("PROD requires Managed Identity=true.")

          if errors:
              print("::error::Issue Form validation failed.")
              for error in errors:
                  print(f"::error::{error}")
              sys.exit(1)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              for key, value in values.items():
                  value = value.replace("%", "%25").replace("\n", "%0A").replace("\r", "%0D")
                  fh.write(f"{key}={value}\n")

          print("Issue Form validation succeeded.")

      - name: Show Request
        env:
          RG: ${{ steps.parse.outputs.resource_group }}
          LOCATION: ${{ steps.parse.outputs.location }}
          PLAN: ${{ steps.parse.outputs.app_service_plan }}
          WEBAPP: ${{ steps.parse.outputs.webapp_name }}
          RUNTIME: ${{ steps.parse.outputs.runtime }}
          OS: ${{ steps.parse.outputs.os }}
          SKU: ${{ steps.parse.outputs.sku }}
          ENVIRONMENT: ${{ steps.parse.outputs.environment }}
          HTTPS: ${{ steps.parse.outputs.https_only }}
          MI: ${{ steps.parse.outputs.managed_identity }}
          PNA: ${{ steps.parse.outputs.public_network_access }}
          AI: ${{ steps.parse.outputs.application_insights }}
        run: |
          echo "=========================================="
          echo "Azure Web App Request"
          echo "=========================================="
          echo "Requester             : ${{ github.actor }}"
          echo "Public Repository     : ${{ github.repository }}"
          echo "Public Issue          : #${{ github.event.issue.number }}"
          echo "Resource Group        : $RG"
          echo "Location              : $LOCATION"
          echo "App Service Plan      : $PLAN"
          echo "Web App               : $WEBAPP"
          echo "Runtime               : $RUNTIME"
          echo "OS                    : $OS"
          echo "SKU                   : $SKU"
          echo "Environment           : $ENVIRONMENT"
          echo "HTTPS Only            : $HTTPS"
          echo "Managed Identity      : $MI"
          echo "Public Network Access : $PNA"
          echo "Application Insights  : $AI"
          echo "=========================================="

      - name: Build Private Request
        env:
          REQUESTER: ${{ github.actor }}
          PUBLIC_REPOSITORY: ${{ github.repository }}
          PUBLIC_RUN_ID: ${{ github.run_id }}
          PUBLIC_ISSUE_NUMBER: ${{ github.event.issue.number }}
          RG: ${{ steps.parse.outputs.resource_group }}
          LOCATION: ${{ steps.parse.outputs.location }}
          PLAN: ${{ steps.parse.outputs.app_service_plan }}
          WEBAPP: ${{ steps.parse.outputs.webapp_name }}
          RUNTIME: ${{ steps.parse.outputs.runtime }}
          OS: ${{ steps.parse.outputs.os }}
          SKU: ${{ steps.parse.outputs.sku }}
          ENVIRONMENT: ${{ steps.parse.outputs.environment }}
          HTTPS: ${{ steps.parse.outputs.https_only }}
          MI: ${{ steps.parse.outputs.managed_identity }}
          PNA: ${{ steps.parse.outputs.public_network_access }}
          AI: ${{ steps.parse.outputs.application_insights }}
        shell: python
        run: |
          import hashlib
          import os
          from pathlib import Path

          values = {
              "REQUESTER": os.environ["REQUESTER"],
              "PUBLIC_REPOSITORY": os.environ["PUBLIC_REPOSITORY"],
              "PUBLIC_RUN_ID": os.environ["PUBLIC_RUN_ID"],
              "RESOURCE_GROUP": os.environ["RG"],
              "LOCATION": os.environ["LOCATION"],
              "APP_SERVICE_PLAN": os.environ["PLAN"],
              "WEBAPP_NAME": os.environ["WEBAPP"],
              "RUNTIME": os.environ["RUNTIME"],
              "OS": os.environ["OS"],
              "SKU": os.environ["SKU"],
              "ENVIRONMENT": os.environ["ENVIRONMENT"],
              "HTTPS_ONLY": os.environ["HTTPS"],
              "MANAGED_IDENTITY": os.environ["MI"],
              "PUBLIC_NETWORK_ACCESS": os.environ["PNA"],
              "APPLICATION_INSIGHTS": os.environ["AI"],
          }

          canonical_keys = [
              "REQUESTER", "PUBLIC_REPOSITORY", "PUBLIC_RUN_ID",
              "RESOURCE_GROUP", "LOCATION", "APP_SERVICE_PLAN",
              "WEBAPP_NAME", "RUNTIME", "OS", "SKU", "ENVIRONMENT",
              "HTTPS_ONLY", "MANAGED_IDENTITY",
              "PUBLIC_NETWORK_ACCESS", "APPLICATION_INSIGHTS",
          ]

          canonical = "|".join(values[key] for key in canonical_keys)
          request_hash = hashlib.sha256(canonical.encode("utf-8")).hexdigest()

          lines = [
              "## Azure Web App Provisioning Request",
              "",
              "このIssueはPublic RepositoryのIssue Formから自動作成された申請です。",
              "",
              "**Azure操作はPrivate Repository側でPrecheck後、`/approve` が実行された場合のみ行われます。**",
              "",
              "### Request Information",
              "",
              "| Parameter | Value |",
              "|---|---|",
          ]

          rows = [
              ("Requester", values["REQUESTER"]),
              ("Public Repository", values["PUBLIC_REPOSITORY"]),
              ("Public Issue", f"#{os.environ['PUBLIC_ISSUE_NUMBER']}"),
              ("Resource Group", values["RESOURCE_GROUP"]),
              ("Location", values["LOCATION"]),
              ("App Service Plan", values["APP_SERVICE_PLAN"]),
              ("Web App", values["WEBAPP_NAME"]),
              ("Runtime", values["RUNTIME"]),
              ("OS", values["OS"]),
              ("SKU", values["SKU"]),
              ("Environment", values["ENVIRONMENT"]),
              ("HTTPS Only", values["HTTPS_ONLY"]),
              ("Managed Identity", values["MANAGED_IDENTITY"]),
              ("Public Network Access", values["PUBLIC_NETWORK_ACCESS"]),
              ("Application Insights", values["APPLICATION_INSIGHTS"]),
          ]

          for label, value in rows:
              lines.append(f"| {label} | {value.replace('|', '\\|').replace(chr(10), ' ')} |")

          lines += [
              "",
              "### Approval",
              "",
              "PrecheckがPASSの場合に承認者が `/approve` をコメントしてください。",
              "",
              "却下する場合は `/reject` をコメントしてください。",
              "",
              "<!-- AZURE_WEBAPP_REQUEST_V1 -->",
          ]

          for key in canonical_keys:
              lines.append(f"{key}={values[key]}")
          lines.append(f"REQUEST_HASH={request_hash}")

          Path("private-request.md").write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8",
          )

          print(f"Request hash: {request_hash}")

      - name: Create Private Approval Issue
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_ISSUE_TOKEN }}
          WEBAPP: ${{ steps.parse.outputs.webapp_name }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::PRIVATE_REPO_ISSUE_TOKEN is not configured as a Repository Secret."
            exit 1
          fi

          gh issue create             --repo kikawaken/create-webapp             --title "Azure Web App Approval - ${WEBAPP} - Public Issue #${{ github.event.issue.number }}"             --body-file private-request.md

          echo "Private approval Issue created successfully."
